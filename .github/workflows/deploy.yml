# Workflow reutilizable: push a GHCR de la imagen ESCANEADA (artifact `image`
# del job `image` de ci.yml) + deploy en Coolify v4 (API). Ver docs/deploy.md.

name: deploy

on:
  workflow_call:
    inputs:
      environment:
        description: "qa | prod"
        required: true
        type: string
      image_tag:
        description: "Tag de git = tag inmutable de la imagen (qa-v* / prod-v*)"
        required: true
        type: string

env:
  LOCAL_IMAGE: "tekitla-gateway:ci"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      TARGET_ENV: ${{ inputs.environment }}
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_RESOURCE_UUID: ${{ inputs.environment == 'prod' && vars.COOLIFY_RESOURCE_UUID_PROD || vars.COOLIFY_RESOURCE_UUID_QA }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: .

      - name: Validar tag y variables
        run: |
          case "$IMAGE_TAG" in
            "${TARGET_ENV}"-v*) ;;
            *) echo "El tag '$IMAGE_TAG' no corresponde al entorno '$TARGET_ENV'"; exit 1 ;;
          esac
          : "${COOLIFY_URL:?Falta la variable COOLIFY_URL}"
          : "${COOLIFY_TOKEN:?Falta el secret COOLIFY_TOKEN}"
          : "${COOLIFY_RESOURCE_UUID:?Falta COOLIFY_RESOURCE_UUID_QA/_PROD}"
          # GHCR exige el nombre en minúsculas.
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Push (GHCR)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker load -i image.tar
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$LOCAL_IMAGE" "$IMAGE:$IMAGE_TAG"
          docker tag "$LOCAL_IMAGE" "$IMAGE:$TARGET_ENV"
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:$TARGET_ENV"

      # Coolify >= 4.6 solo acepta POST en /api/v1/deploy (GET responde 405).
      - name: Deploy (Coolify)
        run: |
          echo "Deploy ${TARGET_ENV} (${IMAGE_TAG}) en Coolify"
          resp="$RUNNER_TEMP/coolify-deploy.json"
          if ! status="$(curl -sS -o "$resp" -w '%{http_code}' -X POST --data '' \
              "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_RESOURCE_UUID&force=false" \
              -H "Authorization: Bearer $COOLIFY_TOKEN" \
              -H "Accept: application/json")"; then
            echo "::error::No se pudo llamar a la API de Coolify en $COOLIFY_URL (red/DNS/TLS)."
            exit 1
          fi
          cat "$resp"; echo
          case "$status" in
            2??) ;;
            401|400) hint="COOLIFY_TOKEN inválido o vencido" ;;
            403) hint="el token no tiene el permiso deploy" ;;
            404) hint="no hay recurso con COOLIFY_RESOURCE_UUID_${TARGET_ENV^^} (o el token es de otro equipo)" ;;
            405) hint="método no permitido: Coolify >= 4.6 pide POST" ;;
            429) hint="cola de deploys llena: reintentá en un minuto" ;;
            *) hint="respuesta inesperada" ;;
          esac
          if [ "${status:0:1}" != 2 ]; then
            echo "::error::Coolify respondió HTTP $status al pedir el deploy: $hint."
            exit 1
          fi
          echo "Deploy encolado en Coolify. Seguilo en el panel (Deployments) del recurso."
