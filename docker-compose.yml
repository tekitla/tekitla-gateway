# =============================================================================
# Desarrollo local — tequio-gateway
# =============================================================================
#
#   make up      # go mod vendor + docker compose up -d --build --wait
#   make down
#
# El Dockerfile compila con -mod=vendor (offline): sin `go mod vendor` previo
# el build falla. `make up` lo hace solo.
#
# Upstreams: por default el gateway busca tequio-issues en la máquina host
# (host.docker.internal:5000), levantado con `make up` en su repo (publica el
# puerto 5000). Para otra dirección: UPSTREAM_ISSUES_ADDR=... make up
#
# Allowlist: AUTH_ALLOWED_EMAILS=tu-email@ejemplo.com make up (vacía = 403
# para todos).
#
# Mismas variables de entorno que en Coolify; solo cambian los valores
# (lista completa: .env.example).
# =============================================================================

name: tequio-gateway

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: tequio-gateway:local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: development
      SERVICE_ENV: dev
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_FORMAT: json
      HTTP_PORT: "8080"
      UPSTREAM_ISSUES_ADDR: ${UPSTREAM_ISSUES_ADDR:-host.docker.internal:5000}
      UPSTREAM_TLS: "false"
      UPSTREAM_AUTH: none
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      TRUSTED_PROXY_HOPS: "0"
      OPENAPI_ENABLED: "true"
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-tequio-app-435b4}
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS:-}
      # Solo desarrollo: JWKS de un emisor de prueba (ver .env.example).
      FIREBASE_JWKS_URL: ${FIREBASE_JWKS_URL:-}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      # Imagen distroless: el binario trae su propio chequeo de /healthz.
      test: ["CMD", "/app/tequio-gateway", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
